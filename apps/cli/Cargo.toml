[package]
name = "t1-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Agent-first pastebin CLI"

[[bin]]
name = "t1"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }
url = "2"
