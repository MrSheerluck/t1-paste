[package]
name = "t1-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Agent-first pastebin CLI for t1-paste"
readme = "README.md"
repository = "https://github.com/MrSheerluck/t1-paste"
homepage = "https://github.com/MrSheerluck/t1-paste"
documentation = "https://docs.rs/t1-cli"
keywords = ["pastebin", "cli", "agents", "paste", "t1"]
categories = ["command-line-utilities"]
authors = ["Transistor One <hello@transistorone.com>"]

[[bin]]
name = "t1"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }
url = "2"
