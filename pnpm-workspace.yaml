packages:
  - apps/*
  - packages/*
  - tools/*
  - "!apps/cli"

catalogMode: prefer

catalog:
  "@hono/node-server": ^2.1.5
  "@hono/zod-openapi": ^1.6.3
  "@types/node": ^24
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  hono: ^4.13.14
  postgres: ^3.4.9
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
